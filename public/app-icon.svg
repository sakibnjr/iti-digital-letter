<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgAmbient" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FAF6EE" stop-opacity="0" />
    </radialGradient>

    <!-- Royal Blue Envelope Shading -->
    <linearGradient id="envOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="45%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Front Curved Pocket Shading -->
    <linearGradient id="pocketShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#172554" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Antique Parchment Letter Sheet -->
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7" />
      <stop offset="50%" stop-color="#FBF3DE" />
      <stop offset="100%" stop-color="#F3E5C8" />
    </linearGradient>

    <!-- 3D Molten Wax Seal (Ruby Crimson) -->
    <radialGradient id="waxRed" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="25%" stop-color="#E11D48" />
      <stop offset="65%" stop-color="#9F1239" />
      <stop offset="88%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4C0519" />
    </radialGradient>

    <!-- Wax Inner Stamp -->
    <radialGradient id="waxInner" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#BE123C" />
      <stop offset="70%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4C0519" />
    </radialGradient>

    <!-- Feather Quill Gradient -->
    <linearGradient id="quillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>

    <filter id="parchmentShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>

    <filter id="sealGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#4C0519" flood-opacity="0.6" />
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="#FAF6EE" />
  <circle cx="256" cy="256" r="240" fill="url(#bgAmbient)" />

  <!-- MAIN ENVELOPE & LETTER ASSEMBLY -->
  <g filter="url(#cardShadow)">
    <!-- Back Envelope Pocket -->
    <rect x="64" y="112" width="384" height="296" rx="32" fill="url(#envOuter)" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.4" />

    <!-- Deckled Parchment Letter (Peeking out of Envelope) -->
    <g filter="url(#parchmentShadow)">
      <path d="M 104 64 
               L 408 64 
               C 414 64 418 68 418 74 
               L 418 260 
               L 94 260 
               L 94 74 
               C 94 68 98 64 104 64 Z" 
            fill="url(#parchment)" 
            stroke="#D97706" 
            stroke-width="1.5" 
            stroke-opacity="0.4" />

      <!-- Handwritten Ink Lines on Letter -->
      <path d="M 128 100 Q 150 96 175 100" stroke="#78350F" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75" />
      <path d="M 128 126 Q 230 122 340 126 T 384 126" stroke="#92400E" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
      <path d="M 128 148 Q 210 144 320 148 T 370 148" stroke="#92400E" stroke-width="3" stroke-linecap="round" stroke-opacity="0.6" />
      <path d="M 128 170 Q 190 166 280 170" stroke="#92400E" stroke-width="3" stroke-linecap="round" stroke-opacity="0.5" />
      <path d="M 310 196 Q 340 192 374 196" stroke="#78350F" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.75" />
    </g>

    <!-- Front Envelope Pocket Layer (Clean Curved Sleeve Without Cross Lines) -->
    <path d="M 64 240 
             Q 256 295 448 240 
             L 448 376 
             C 448 394 434 408 416 408 
             L 96 408 
             C 78 408 64 394 64 376 Z" 
          fill="url(#pocketShade)" 
          stroke="#38BDF8" 
          stroke-width="1.8" 
          stroke-opacity="0.35" />
  </g>

  <!-- 3D Molten Wax Seal (Centerpiece) -->
  <g filter="url(#sealGlow)">
    <!-- Melted Organic Wax Rim -->
    <path d="M 256 220 
             C 282 218 312 224 330 242 
             C 348 260 354 287 352 313 
             C 350 340 338 367 318 385 
             C 298 403 270 407 245 405 
             C 218 403 189 393 173 373 
             C 157 352 156 323 160 298 
             C 164 271 179 246 200 232 
             C 216 222 237 221 256 220 Z" 
          fill="url(#waxRed)" />

    <!-- Inner Stamp Recessed Circle -->
    <circle cx="256" cy="313" r="62" fill="url(#waxInner)" stroke="#FDA4AF" stroke-width="2" stroke-opacity="0.7" />

    <!-- Beaded Stamped Rim -->
    <circle cx="256" cy="313" r="54" fill="none" stroke="#FDA4AF" stroke-width="1.6" stroke-opacity="0.6" stroke-dasharray="5 3.5" />

    <!-- Embossed Heart Insignia in Wax -->
    <path d="M 256 336 
             C 256 336 218 308 218 286 
             C 218 272 229 262 242 262 
             C 250 262 256 267 256 272 
             C 256 267 262 262 270 262 
             C 283 262 294 272 294 286 
             C 294 308 256 336 256 336 Z" 
          fill="#FFE4E6" 
          stroke="#FFFFFF" 
          stroke-width="1" 
          stroke-opacity="0.6" 
          style="filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));" />

    <!-- Specular Highlight Curve on Wax -->
    <path d="M 194 247 C 212 229 244 225 274 228" fill="none" stroke="#FFF1F2" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.6" />
  </g>

  <!-- Golden Antique Feather Quill (Angled Writing Accent) -->
  <g filter="url(#parchmentShadow)" transform="rotate(-28 350 180)">
    <!-- Feather Spine -->
    <path d="M 350 80 Q 348 180 344 260" stroke="#78350F" stroke-width="3" stroke-linecap="round" />
    
    <!-- Feather Vane -->
    <path d="M 350 80 
             C 310 110 300 160 315 210 
             C 325 240 344 255 344 255 
             C 344 255 365 240 375 210 
             C 390 160 380 110 350 80 Z" 
          fill="url(#quillGrad)" 
          stroke="#FDE68A" 
          stroke-width="1.5" 
          stroke-opacity="0.8" />

    <!-- Feather Barb Slits Details -->
    <path d="M 330 150 L 348 165" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" />
    <path d="M 366 170 L 347 185" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" />
    <path d="M 334 190 L 346 205" stroke="#78350F" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.4" />

    <!-- Quill Metal Nib Tip -->
    <path d="M 344 255 L 341 278 L 344 284 L 347 278 Z" fill="#FDE68A" stroke="#78350F" stroke-width="1" />
  </g>

  <!-- Golden Floating Sparkles -->
  <g filter="url(#starGlow)">
    <path d="M 436 94 C 436 108 424 120 410 120 C 424 120 436 132 436 146 C 436 132 448 120 462 120 C 448 120 436 108 436 94 Z" fill="#FBBF24" />
    <path d="M 86 102 C 86 112 77 121 67 121 C 77 121 86 130 86 140 C 86 130 95 121 105 121 C 95 121 86 112 86 102 Z" fill="#FDE68A" />
    <path d="M 120 416 C 120 424 113 430 105 430 C 113 430 120 436 120 444 C 120 436 127 430 135 430 C 127 430 120 424 120 416 Z" fill="#F59E0B" />
  </g>
</svg>
