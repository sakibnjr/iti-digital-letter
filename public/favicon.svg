<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Royal Blue Envelope Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Front Pocket Shading -->
    <linearGradient id="pocketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#172554" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.95" />
    </linearGradient>

    <!-- Warm Golden Parchment Liner -->
    <linearGradient id="paperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7" />
      <stop offset="100%" stop-color="#FDE68A" />
    </linearGradient>

    <!-- 3D Crimson Wax Seal -->
    <radialGradient id="favWax" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="35%" stop-color="#BE123C" />
      <stop offset="85%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4C0519" />
    </radialGradient>
  </defs>

  <!-- Envelope Body Base -->
  <rect x="2" y="5" width="28" height="22" rx="5" fill="url(#favBg)" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- Inner Parchment Letter Peeking Out -->
  <path d="M 5 7.5 L 27 7.5 L 27 18 L 5 18 Z" fill="url(#paperGrad)" />

  <!-- Subtle Letter Handwriting Lines on Paper -->
  <line x1="8" y1="10.5" x2="17" y2="10.5" stroke="#78350F" stroke-width="0.85" stroke-linecap="round" opacity="0.65" />
  <line x1="8" y1="12.8" x2="24" y2="12.8" stroke="#78350F" stroke-width="0.85" stroke-linecap="round" opacity="0.5" />

  <!-- Front Pocket Layer (Curved Pocket Rim without Cross Lines) -->
  <path d="M 2 15 Q 16 19 30 15 L 30 22 C 30 24.8 27.8 27 25 27 L 7 27 C 4.2 27 2 24.8 2 22 Z" fill="url(#pocketGrad)" stroke="#38BDF8" stroke-width="0.6" stroke-opacity="0.25" />

  <!-- Wax Seal Shadow -->
  <circle cx="16" cy="18" r="5.2" fill="#000000" opacity="0.45" />

  <!-- 3D Crimson Wax Seal -->
  <circle cx="16" cy="17.5" r="4.8" fill="url(#favWax)" stroke="#FDA4AF" stroke-width="0.5" stroke-opacity="0.85" />

  <!-- Mini Wax Heart Stamp Emblem (Pure Symbol) -->
  <path d="M 16 19.5 C 16 19.5 13.5 17.7 13.5 16.3 C 13.5 15.4 14.2 14.7 15.1 14.7 C 15.6 14.7 16 15 16 15.3 C 16 15 16.4 14.7 16.9 14.7 C 17.8 14.7 18.5 15.4 18.5 16.3 C 18.5 17.7 16 19.5 16 19.5 Z" fill="#FFE4E6" opacity="0.95" />

  <!-- Tiny Golden Sparkle -->
  <path d="M 26 4.5 C 26 5.5 25 6.5 24 6.5 C 25 6.5 26 7.5 26 8.5 C 26 7.5 27 6.5 28 6.5 C 27 6.5 26 5.5 26 4.5 Z" fill="#FBBF24" />
</svg>
